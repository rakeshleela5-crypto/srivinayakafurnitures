name = "srivinayakafurnitures"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "srivinayaka-db"
database_id = "dec7abfc-0131-434b-9d31-fa19770a6203"

[ai]
binding = "AI"
