name = "srivinayaka-master-cron"
main = "index.js"
compatibility_date = "2024-09-19"

[triggers]
# Cloudflare Free plan allows up to 5 cron triggers per account.
# A single master 30-minute cron trigger orchestrates all 20 showroom bots with sub-second accuracy.
crons = [
  "*/30 * * * *"  # Master Fleet Trigger: evaluates and executes due bots every 30 minutes
]
