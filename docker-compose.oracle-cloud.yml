# OmniBuild OS™ — Oracle Cloud (OCI Always Free) 24/7 WhatsApp Gateway
# Architecture: Evolution API + PostgreSQL + Redis
# 100% Free Forever on Oracle Cloud Infrastructure (Ampere A1 or AMD Micro VM)

version: '3.8'

services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${DB_PASSWORD:-godrej_rayagada_db_2026}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Server Config
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}

      # Authentication
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-godrej_rayagada_secret_2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Database (PostgreSQL for rock-solid permanent session storage)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${DB_PASSWORD:-godrej_rayagada_db_2026}@evolution-postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Cache (Redis for fast message delivery)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution

      # Branding & Phone Session
      CONFIG_SESSION_PHONE_CLIENT: "Sri Vinayaka Furnitures (Godrej Interio)"
      CONFIG_SESSION_PHONE_NAME: "Rayagada Flagship Showroom"

      # Webhook Configuration (Logs to Google Sheets Webhook)
      WEBHOOK_GLOBAL_ENABLED: "false"

      # Log Level
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
    volumes:
      - ./evolution_instances:/evolution/instances
    networks:
      - evolution-net

networks:
  evolution-net:
    driver: bridge
